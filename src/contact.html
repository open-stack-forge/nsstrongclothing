<!--{"title": "Contact Us | NS Strong Clothing Co., Nova Scotia", "description": "Contact NS Strong Clothing Company, a Nova Scotia apparel brand, about orders, sizing, returns, or team and bulk apparel orders.", "nav": "contact"}-->
<section class="page-hero"><div class="container"><h1>Contact us</h1><p>Questions about an order, sizing or bulk orders? Send us a message and we'll reply within 1–2 business days.</p></div></section>
<section class="section"><div class="container">
  <p id="contact-email" class="small">We're an online-only business based in Nova Scotia, Canada.</p>
  <form class="form" id="contact-form">
    <label>Name<input name="name" autocomplete="name" required></label>
    <label>Email<input name="email" type="email" autocomplete="email" required></label>
    <label>Topic<select name="topic"><option>General question</option><option>Order help</option><option>Returns &amp; exchanges</option><option>Team or bulk order</option><option>Wholesale</option></select></label>
    <label>Order number (optional)<input name="order"></label>
    <label>Message<textarea name="message" rows="6" required></textarea></label>
    <button class="btn" type="submit">Send message</button>
    <p class="notice notice-info" id="form-status" role="status" hidden></p>
  </form>
</div></section>
